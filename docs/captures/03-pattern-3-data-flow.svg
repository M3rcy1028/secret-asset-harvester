<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="909" viewBox="0 0 1500 909">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="42" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Case 3 — P3: separate lines, CodeQL-style data flow</text>
<text x="42" y="82" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case03_data_flow/orders_repository.py</text>
<text x="42" y="107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&quot;&quot;&quot;Repository layer used by a scheduled order synchronization job.&quot;&quot;&quot;</text>
<text x="42" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import asyncpg</text>
<text x="42" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import pymysql</text>
<text x="42" y="207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="232" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">MYSQL_SETTINGS = {</text>
<text x="42" y="282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;host&quot;: &quot;mysql-orders.demo.internal&quot;,</text>
<text x="42" y="307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;password&quot;: &quot;fake-orders-password&quot;,</text>
<text x="42" y="332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;database&quot;: &quot;orders&quot;,</text>
<text x="42" y="357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">}</text>
<text x="42" y="382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def open_mysql_pool():</text>
<text x="42" y="457" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return pymysql.connect(</text>
<text x="42" y="482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host=MYSQL_SETTINGS[&quot;host&quot;],</text>
<text x="42" y="507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password=MYSQL_SETTINGS[&quot;password&quot;],</text>
<text x="42" y="532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        database=MYSQL_SETTINGS[&quot;database&quot;],</text>
<text x="42" y="557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    )</text>
<text x="42" y="582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="607" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def open_payment_pool():</text>
<text x="42" y="657" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    payment_host = &quot;payments.demo.internal&quot;</text>
<text x="42" y="682" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    payment_password = &quot;fake-payments-password&quot;</text>
<text x="42" y="707" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return asyncpg.connect(payment_host, 5432, &quot;payments_worker&quot;, payment_password, &quot;payments&quot;)</text>
<text x="42" y="732" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="757" fill="#fbbf24" font-family="Consolas, monospace" font-size="16">RESULTS</text>
<text x="42" y="782" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[static-value-flow/P3] orders_repository.py:15  fa****************rd -&gt; mysql-orders.demo.internal:orders</text>
<text x="42" y="807" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[neighboring-lines/P3] orders_repository.py:24  fa******************rd -&gt; payments.demo.internal</text>
</svg>