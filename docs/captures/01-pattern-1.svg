<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1034" viewBox="0 0 1500 1034">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="42" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Case 1 — P1: connection-string pattern matching</text>
<text x="42" y="82" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case01_connection_strings/app.py</text>
<text x="42" y="107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&quot;&quot;&quot;A small order-import worker with production-style database URLs.&quot;&quot;&quot;</text>
<text x="42" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">from dataclasses import dataclass</text>
<text x="42" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="232" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">@dataclass(frozen=True)</text>
<text x="42" y="257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">class ImportJob:</text>
<text x="42" y="282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    name: str</text>
<text x="42" y="307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    connection_url: str</text>
<text x="42" y="332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">JOBS = [</text>
<text x="42" y="407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    ImportJob(&quot;orders&quot;, &quot;mysql://etl:fake-mysql-password@mysql.demo.internal:3306/orders&quot;),</text>
<text x="42" y="432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    ImportJob(&quot;billing&quot;, &quot;postgresql://etl:fake-postgres-password@postgres.demo.internal/billing&quot;),</text>
<text x="42" y="457" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    ImportJob(&quot;events&quot;, &quot;mongodb://etl:fake-mongo-password@mongo.demo.internal/events&quot;),</text>
<text x="42" y="482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">]</text>
<text x="42" y="507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">WAREHOUSE_ODBC = &quot;Driver={SQL Server};Server=warehouse.demo.internal;Port=1433;Database=warehouse;Uid=etl;Pwd=fake-odbc-password;&quot;</text>
<text x="42" y="557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">REPORTING_OLEDB = &quot;Provider=SQLOLEDB;Data Source=sql.demo.internal;Initial Catalog=reporting;User Id=etl;Password=fake-oledb-password;&quot;</text>
<text x="42" y="582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">JDBC_URL = &quot;jdbc:postgresql://jdbc.demo.internal:5432/analytics?user=etl&amp;password=fake-jdbc-password&quot;</text>
<text x="42" y="607" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">JDBC_REPORTING_URL = &quot;jdbc:sqlserver://jdbc-sql.demo.internal:1433/reporting?user=etl&amp;password=fake-jdbc-sql-password&quot;</text>
<text x="42" y="632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="657" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="682" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def configured_jobs() -&gt; list[ImportJob]:</text>
<text x="42" y="707" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return JOBS</text>
<text x="42" y="732" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="757" fill="#fbbf24" font-family="Consolas, monospace" font-size="16">RESULTS</text>
<text x="42" y="782" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:13  fa***************rd -&gt; mysql.demo.internal:3306:orders</text>
<text x="42" y="807" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:14  fa******************rd -&gt; postgres.demo.internal:billing</text>
<text x="42" y="832" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:15  fa***************rd -&gt; mongo.demo.internal:events</text>
<text x="42" y="857" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:18  fa**************rd -&gt; warehouse.demo.internal:warehouse</text>
<text x="42" y="882" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:19  fa***************rd -&gt; sql.demo.internal:reporting</text>
<text x="42" y="907" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:20  fa**************rd -&gt; jdbc.demo.internal:5432:analytics</text>
<text x="42" y="932" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[pattern-matching/P1] app.py:21  fa******************rd -&gt; jdbc-sql.demo.internal:1433:reporting</text>
</svg>