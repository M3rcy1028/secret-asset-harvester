<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="734" viewBox="0 0 1500 734">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="42" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Case 2 — P2: separate strings on one call line</text>
<text x="42" y="82" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case02_same_line/webhook_handler.py</text>
<text x="42" y="107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&quot;&quot;&quot;HTTP-style webhook handler that opens a reporting connection.&quot;&quot;&quot;</text>
<text x="42" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import mysql.connector</text>
<text x="42" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="232" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def handle_webhook(payload: dict[str, str]) -&gt; dict[str, int]:</text>
<text x="42" y="257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    connection = mysql.connector.connect(</text>
<text x="42" y="282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host=payload.get(&quot;db_host&quot;, &quot;webhook.demo.internal&quot;),</text>
<text x="42" y="307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password=payload.get(&quot;db_password&quot;, &quot;fake-webhook-password&quot;),</text>
<text x="42" y="332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        database=&quot;webhooks&quot;,</text>
<text x="42" y="357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    )</text>
<text x="42" y="382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    cursor = connection.cursor()</text>
<text x="42" y="407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    cursor.execute(&quot;INSERT INTO deliveries (event_id) VALUES (%s)&quot;, (payload[&quot;id&quot;],))</text>
<text x="42" y="432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    connection.commit()</text>
<text x="42" y="457" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return {&quot;status&quot;: 202}</text>
<text x="42" y="482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def handle_batch(payload: dict[str, str]) -&gt; None:</text>
<text x="42" y="557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    mysql.connector.connect(**{&quot;host&quot;: &quot;batch.demo.internal&quot;, &quot;password&quot;: &quot;fake-batch-password&quot;, &quot;database&quot;: &quot;batch&quot;})</text>
<text x="42" y="582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="607" fill="#fbbf24" font-family="Consolas, monospace" font-size="16">RESULTS</text>
<text x="42" y="632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[static-value-flow/P2] webhook_handler.py:19  fa***************rd -&gt; batch.demo.internal:batch</text>
</svg>