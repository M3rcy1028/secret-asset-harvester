<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1984" viewBox="0 0 1500 1984">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="42" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Case 5 — P4: YAML, JSON, and XML configuration parsing</text>
<text x="42" y="82" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case05_config_flow/config.yaml</text>
<text x="42" y="107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">mysql:</text>
<text x="42" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  host: mysql-config.demo.internal</text>
<text x="42" y="157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  password: fake-config-mysql-password</text>
<text x="42" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  database: orders</text>
<text x="42" y="207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="232" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case05_config_flow/config.json</text>
<text x="42" y="257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">{</text>
<text x="42" y="282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  &quot;postgres&quot;: {</text>
<text x="42" y="307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;host&quot;: &quot;postgres-config.demo.internal&quot;,</text>
<text x="42" y="332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;password&quot;: &quot;fake-config-postgres-password&quot;,</text>
<text x="42" y="357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    &quot;database&quot;: &quot;billing&quot;</text>
<text x="42" y="382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  }</text>
<text x="42" y="407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">}</text>
<text x="42" y="432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="457" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case05_config_flow/config.xml</text>
<text x="42" y="482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&lt;database&gt;</text>
<text x="42" y="507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  &lt;host&gt;mongo-config.demo.internal&lt;/host&gt;</text>
<text x="42" y="532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">  &lt;password&gt;fake-config-mongo-password&lt;/password&gt;</text>
<text x="42" y="557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&lt;/database&gt;</text>
<text x="42" y="582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="607" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case05_config_flow/app.py</text>
<text x="42" y="632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&quot;&quot;&quot;Application startup loading database settings in common config formats.&quot;&quot;&quot;</text>
<text x="42" y="657" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="682" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import json</text>
<text x="42" y="707" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">from pathlib import Path</text>
<text x="42" y="732" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">from xml.etree import ElementTree</text>
<text x="42" y="757" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="782" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import aiomysql</text>
<text x="42" y="807" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import pymongo</text>
<text x="42" y="832" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import pymysql</text>
<text x="42" y="857" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import yaml</text>
<text x="42" y="882" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="907" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="932" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">BASE_DIR = Path(__file__).parent</text>
<text x="42" y="957" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="982" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1007" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def load_mysql_config() -&gt; dict:</text>
<text x="42" y="1032" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    with open(BASE_DIR / &quot;config.yaml&quot;, encoding=&quot;utf-8&quot;) as handle:</text>
<text x="42" y="1057" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        mysql_config = yaml.safe_load(handle)</text>
<text x="42" y="1082" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return mysql_config</text>
<text x="42" y="1107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def connect_mysql():</text>
<text x="42" y="1182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    mysql_config = load_mysql_config()</text>
<text x="42" y="1207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return aiomysql.connect(</text>
<text x="42" y="1232" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host=mysql_config[&quot;mysql&quot;][&quot;host&quot;],</text>
<text x="42" y="1257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password=mysql_config[&quot;mysql&quot;][&quot;password&quot;],</text>
<text x="42" y="1282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        db=mysql_config[&quot;mysql&quot;][&quot;database&quot;],</text>
<text x="42" y="1307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    )</text>
<text x="42" y="1332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def connect_postgres():</text>
<text x="42" y="1407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    with open(BASE_DIR / &quot;config.json&quot;, encoding=&quot;utf-8&quot;) as handle:</text>
<text x="42" y="1432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        postgres_config = json.load(handle)</text>
<text x="42" y="1457" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return pymysql.connect(</text>
<text x="42" y="1482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host=postgres_config[&quot;postgres&quot;][&quot;host&quot;],</text>
<text x="42" y="1507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password=postgres_config[&quot;postgres&quot;][&quot;password&quot;],</text>
<text x="42" y="1532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        database=postgres_config[&quot;postgres&quot;][&quot;database&quot;],</text>
<text x="42" y="1557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    )</text>
<text x="42" y="1582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1607" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def connect_document_store():</text>
<text x="42" y="1657" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    root = ElementTree.parse(BASE_DIR / &quot;config.xml&quot;).getroot()</text>
<text x="42" y="1682" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return pymongo.MongoClient(</text>
<text x="42" y="1707" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host=root.findtext(&quot;host&quot;),</text>
<text x="42" y="1732" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password=root.findtext(&quot;password&quot;),</text>
<text x="42" y="1757" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    )</text>
<text x="42" y="1782" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="1807" fill="#fbbf24" font-family="Consolas, monospace" font-size="16">RESULTS</text>
<text x="42" y="1832" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[config-key-data-flow/P4] app.py:24  fa**********************rd -&gt; mysql-config.demo.internal</text>
<text x="42" y="1857" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[config-key-data-flow/P4] app.py:34  fa*************************rd -&gt; postgres-config.demo.internal</text>
<text x="42" y="1882" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">[config-key-data-flow/P4] app.py:43  fa**********************rd -&gt; mongo-config.demo.internal</text>
</svg>