<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="809" viewBox="0 0 1500 809">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="42" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Case 8 — interprocedural global data flow</text>
<text x="42" y="82" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">$ case08_global_flow/service.py</text>
<text x="42" y="107" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">&quot;&quot;&quot;Service factory where request settings cross a function boundary.&quot;&quot;&quot;</text>
<text x="42" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="157" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">import pymysql</text>
<text x="42" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="207" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="232" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def build_database_options(environment: str) -&gt; tuple[str, str]:</text>
<text x="42" y="257" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    if environment == &quot;production&quot;:</text>
<text x="42" y="282" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host = &quot;production-orders.demo.internal&quot;</text>
<text x="42" y="307" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password = &quot;fake-production-password&quot;</text>
<text x="42" y="332" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    else:</text>
<text x="42" y="357" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        host = &quot;staging-orders.demo.internal&quot;</text>
<text x="42" y="382" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        password = &quot;fake-staging-password&quot;</text>
<text x="42" y="407" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return host, password</text>
<text x="42" y="432" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="457" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="482" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def create_connection(environment: str):</text>
<text x="42" y="507" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    host, password = build_database_options(environment)</text>
<text x="42" y="532" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    return pymysql.connect(host=host, password=password, database=&quot;orders&quot;)</text>
<text x="42" y="557" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="582" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="607" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">def start_worker() -&gt; None:</text>
<text x="42" y="632" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">    create_connection(&quot;staging&quot;)</text>
<text x="42" y="657" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16"></text>
<text x="42" y="682" fill="#fbbf24" font-family="Consolas, monospace" font-size="16">RESULTS</text>
<text x="42" y="707" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">(no findings)</text>
</svg>